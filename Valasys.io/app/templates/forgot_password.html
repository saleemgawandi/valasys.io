<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Forgot Password | Valasys.io</title>

    <link
        rel="stylesheet"
        href="{{ url_for(
            'static',
            path='css/login.css'
        ) }}"
    >

</head>

<body>

<section class="login-section">

    <div class="login-card">

        <div class="mobile-logo"
             style="display:block;">
            Valasys<span>.io</span>
        </div>

        <h2>
            Forgot Password?
        </h2>

        <p class="login-subtitle">

            Password reset functionality can be
            connected to your email service.

        </p>

        <form>

            <div class="form-group">

                <label>
                    Email
                </label>

                <input
                    type="email"
                    placeholder="Enter your email"
                    required
                >

            </div>

            <button
                type="submit"
                class="login-button"
            >
                Send Reset Link
            </button>

        </form>

        <div
            style="
                margin-top:25px;
                text-align:center;
            "
        >

            <a href="/">
                Back to Login
            </a>

        </div>

    </div>

</section>

</body>

</html>
