<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login | Valasys.io</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', path='css/login.css') }}"
    >

</head>

<body>

<div class="login-container">

    <!-- LEFT SIDE -->

    <section class="branding-section">

        <video
            class="background-video"
            autoplay
            muted
            loop
            playsinline
        >

            <source
                src="{{ url_for(
                    'static',
                    path='videos/valasys-promo.mp4'
                ) }}"
                type="video/mp4"
            >

            Your browser does not support video.

        </video>

        <div class="video-overlay"></div>

        <div class="branding-content">

            <div class="logo">
                Valasys<span>.io</span>
            </div>

            <h1>
                Intelligence that
                drives business growth.
            </h1>

            <p>
                Welcome to the Valasys.io platform.
            </p>

        </div>

    </section>


    <!-- RIGHT SIDE -->

    <section class="login-section">

        <div class="login-card">

            <div class="mobile-logo">
                Valasys<span>.io</span>
            </div>

            <h2>
                Welcome Back
            </h2>

            <p class="login-subtitle">
                Sign in to your Valasys.io account
            </p>


            {% if error %}

            <div class="error-message">
                {{ error }}
            </div>

            {% endif %}


            <form
                id="loginForm"
                method="POST"
                action="/login"
            >

                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        value="{{ email or '' }}"
                        placeholder="Enter your email"
                        autocomplete="email"
                        required
                    >

                    <small
                        id="emailError"
                        class="field-error"
                    ></small>

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <div class="password-wrapper">

                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Enter your password"
                            autocomplete="current-password"
                            required
                            minlength="8"
                        >

                        <button
                            type="button"
                            id="togglePassword"
                            class="password-toggle"
                        >
                            Show
                        </button>

                    </div>

                    <small
                        id="passwordError"
                        class="field-error"
                    ></small>

                </div>


                <div class="forgot-wrapper">

                    <a href="/forgot-password">
                        Forgot Password?
                    </a>

                </div>


                <button
                    type="submit"
                    class="login-button"
                    id="loginButton"
                >

                    <span id="buttonText">
                        Login
                    </span>

                </button>

            </form>


            <div class="login-footer">

                <p>
                    © 2026 Valasys.io. All rights reserved.
                </p>

            </div>

        </div>

    </section>

</div>


<script
    src="{{ url_for(
        'static',
        path='js/login.js'
    ) }}"
></script>

</body>

</html>
